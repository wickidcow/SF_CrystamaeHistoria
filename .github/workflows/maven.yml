name: Build CrystamaeHistoria

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.0"
  OUTPUT_NAME: "SF_CrystamaeHistoria1.0.0.jar"
  MAVEN_OPTS: "--sun-misc-unsafe-memory-access=allow"

concurrency:
  group: crystamaehistoria-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "<version>${VERSION}</version>" pom.xml
          grep -Fq '<finalName>SF_CrystamaeHistoria${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'folia-supported: true' src/main/resources/plugin.yml
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi

      - name: Verify Paper/Purpur/Leaf 1.21.11 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean compile

      - name: Verify Paper/Purpur/Leaf 26.2 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests "-Dpaper.version=[26.2.build,26.3)" clean compile

      - name: Verify Paper/Purpur/Leaf 26.3 compilation
        run: mvn --batch-mode --no-transfer-progress -DskipTests "-Dpaper.version=[26.3.build,26.4)" clean compile

      - name: Build universal release JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package

      - name: Verify and stage raw JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${VERSION}"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          unzip -p "$JAR" plugin.yml | grep -Fq 'folia-supported: true'
          javap -verbose -classpath "$JAR" io.github.sefiraat.crystamaehistoria.CrystamaeHistoria | grep -Fq 'major version: 65'
          javap -c -classpath "$JAR" io.github.sefiraat.crystamaehistoria.libs.infinitylib.common.Scheduler > /tmp/crystamae-scheduler.txt
          grep -Fq 'getGlobalRegionScheduler' /tmp/crystamae-scheduler.txt
          if grep -Fq 'Bukkit.getScheduler' /tmp/crystamae-scheduler.txt; then
            echo "Legacy BukkitScheduler call leaked into shaded InfinityLib Scheduler" >&2
            exit 1
          fi
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "dist/${OUTPUT_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
