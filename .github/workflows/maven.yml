name: Build CrystamaeHistoria

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.1"
  OUTPUT_NAME: "SF_CrystamaeHistoria1.0.1.jar"
  MAVEN_OPTS: "--sun-misc-unsafe-memory-access=allow"

concurrency:
  group: crystamaehistoria-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "<version>${VERSION}</version>" pom.xml
          grep -Fq '<finalName>SF_CrystamaeHistoria${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Fq 'folia-supported: true' src/main/resources/plugin.yml
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi

      - name: Verify Paper/Purpur/Leaf 1.21.11 compilation and tests
        run: |
          mvn --batch-mode --no-transfer-progress -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean test
          mkdir -p evidence/1.21.11
          cp target/surefire-reports/TEST-*.xml evidence/1.21.11/

      - name: Verify Paper/Purpur/Leaf 26.2 compilation and tests
        run: |
          mvn --batch-mode --no-transfer-progress -Dpaper.version=26.2.build.129-stable clean test
          mkdir -p evidence/26.2
          cp target/surefire-reports/TEST-*.xml evidence/26.2/
          grep -Fq '/paper-api/26.2.build.129-stable/paper-api-26.2.build.129-stable.jar' evidence/26.2/TEST-io.github.sefiraat.crystamaehistoria.managers.StoryMaterialsTest.xml

      - name: Verify Paper/Purpur/Leaf 26.3 compilation and tests
        run: |
          mvn --batch-mode --no-transfer-progress -Dpaper.version=26.3.build.205-stable clean test
          mkdir -p evidence/26.3
          cp target/surefire-reports/TEST-*.xml evidence/26.3/
          grep -Fq '/paper-api/26.3.build.205-stable/paper-api-26.3.build.205-stable.jar' evidence/26.3/TEST-io.github.sefiraat.crystamaehistoria.managers.StoryMaterialsTest.xml

      - name: Verify persisted data startup boundary
        run: python3 scripts/verify_persisted_data_safety.py
      - name: Build and test universal release JAR
        run: mvn --batch-mode --no-transfer-progress -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package
      - name: Retain persisted data regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persisted-data-test-evidence
          path: |
            evidence/**/TEST-*.xml
            target/surefire-reports/TEST-*.xml
          if-no-files-found: warn

      - name: Verify and stage raw JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${VERSION}"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          unzip -p "$JAR" plugin.yml | grep -Fq 'folia-supported: true'
          javap -verbose -classpath "$JAR" io.github.sefiraat.crystamaehistoria.CrystamaeHistoria | grep -Fq 'major version: 65'
          javap -classpath "$JAR" io.github.sefiraat.crystamaehistoria.CrystamaeHistoria | grep -Fq 'extends io.github.sefiraat.crystamaehistoria.infinitylib.core.AbstractAddon'
          unzip -l "$JAR" | grep -Fq 'io/github/sefiraat/crystamaehistoria/infinitylib/core/AbstractAddon.class'
          if unzip -l "$JAR" | grep -Fq 'io/github/sefiraat/crystamaehistoria/libs/infinitylib/'; then
            echo "InfinityLib was incorrectly relocated under .libs; this breaks AbstractAddon validation" >&2
            exit 1
          fi
          javap -c -classpath "$JAR" io.github.sefiraat.crystamaehistoria.infinitylib.common.Scheduler > /tmp/crystamae-scheduler.txt
          grep -Fq 'getGlobalRegionScheduler' /tmp/crystamae-scheduler.txt
          if grep -Fq 'Bukkit.getScheduler' /tmp/crystamae-scheduler.txt; then
            echo "Legacy BukkitScheduler call leaked into shaded InfinityLib Scheduler" >&2
            exit 1
          fi
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Upload downloadable JAR and verification bundle
        uses: actions/upload-artifact@v7
        with:
          name: story-material-fix-package
          path: |
            dist/${{ env.OUTPUT_NAME }}
            evidence/
            target/surefire-reports/TEST-*.xml
          if-no-files-found: error

      - name: Check release publication state
        id: release_state
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish canonical GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref_name == github.event.repository.default_branch && steps.release_state.outputs.exists == 'false')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/${OUTPUT_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "dist/${OUTPUT_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "CrystamaeHistoria ${VERSION}" \
              --generate-notes
          fi
