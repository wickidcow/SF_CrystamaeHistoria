name: CrystamaeHistoria
author: Sefiraat
description: Slimefun Legacy maintenance build of Crystamae Historia for Minecraft 1.21.11 through 26.3.
main: io.github.sefiraat.crystamaehistoria.CrystamaeHistoria
website: https://github.com/wickidcow/SF_CrystamaeHistoria
version: ${project.version}
api-version: '1.21.11'
folia-supported: true
depend:
  - Slimefun
softdepend:
  - mcMMO
  - SlimeTinker
  - ExoticGarden
  - HeadLimiter
  - RoseStacker
  - WildStacker
  - Netheopoiesis
commands:
  crystamaehistoria:
    description: Main Crystamae Historia command.
    usage: /historia <sub>
    aliases: [ch, hist]
